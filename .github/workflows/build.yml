name: Build Library

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build library and examples
        run: cmake --build build --config Release

      - name: Smoke test (headless sandbox)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: ./build/examples/sandbox/sandbox --headless --frames 120

      - name: Install SDK layout
        run: cmake --install build --config Release --prefix dist

      - name: Upload SDK
        uses: actions/upload-artifact@v4
        with:
          name: AnchorPoint-SDK-${{ matrix.os }}
          path: dist/
